name: Project Gallery
description: web2026 Project Gallery - Submit your final site & join the class webring
title: "[STUDENT] Your Name"
labels: ["student"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this out to add your final site to the course gallery and the class
        **webring**, a little widget that links your site to your classmates'.

        Once your submission is in, grab the one-line embed snippet at
        https://teaching.aman.bh/web2026/showcase/webring to add the ring to your own site.

  - type: input
    id: student-name
    attributes:
      label: Student Name
      description: Your full name as you'd like it to appear in the gallery
      placeholder: e.g., Baburao Apte
    validations:
      required: true

  - type: input
    id: website-url
    attributes:
      label: Website URL
      description: The URL of your deployed site (perfectly okay if it is the Netlify URL)
      placeholder: e.g., https://star-garage.netlify.app
    validations:
      required: true

  - type: input
    id: social-link-1
    attributes:
      label: Social Link 1 (Optional)
      description: Your first social media or external link if you want to have that (Instagram, Twitter, etc.)
      placeholder: e.g., https://instagram.com/baburao

  - type: input
    id: social-link-2
    attributes:
      label: Social Link 2 (Optional)
      description: Your second social media
      placeholder: e.g., https://linkedin.com/in/shyam

  - type: input
    id: social-link-3
    attributes:
      label: Social Link 3 (Optional)
      description: Your third social media or portfolio link
      placeholder: e.g., https://twitter.com/baburao
