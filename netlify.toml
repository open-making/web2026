# The site's public URL (teaching.aman.bh/web2026/showcase) is a 200-rewrite
# proxy configured in the teaching-site repo's _redirects, not here.

[build]
  command = "pnpm build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "font/woff2"

# Vite content-hashes everything under _app/immutable
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
