<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- web2026 mark: a ransom "w" scrap. two riso tiles slightly misregistered
       (pink under, violet over) with a paper "w" cut out, echoing the masthead.
       The "w" is a geometric stroke, not font text, so it rasterises cleanly at
       16px without embedding Cartridge. -->
  <!-- pink pass, offset like a second ink printed a hair off -->
  <rect x="86" y="94" width="340" height="340" rx="26" fill="#ff48b0" transform="rotate(-6 256 256)"/>
  <!-- violet tile on top -->
  <rect x="78" y="82" width="340" height="340" rx="26" fill="#321871" transform="rotate(3 256 256)"/>
  <!-- the w, in paper -->
  <path d="M150 176 L200 342 L256 236 L312 342 L362 176"
        fill="none" stroke="#faf7ef" stroke-width="46"
        stroke-linejoin="round" stroke-linecap="round"
        transform="rotate(3 256 256)"/>
</svg>
